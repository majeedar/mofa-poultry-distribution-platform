server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — return index.html for all client-side routes
    # (prevents 404 on hard refresh or direct URL access)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip static assets for faster delivery
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# Note: API requests (http://localhost:3000) and Socket.io connections are made
# by the browser directly to the server container's exposed port — no proxy needed here.
